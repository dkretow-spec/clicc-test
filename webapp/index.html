<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>JUDI — Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <style>
    :root {
      --bg: #0e0e14;
      --bg2: #16161f;
      --card: #1c1c28;
      --card2: #232334;
      --border: #2a2a3d;
      --text: #f2f2f7;
      --muted: #8a8a9e;
      --accent: #ff7a3d;
      --accent2: #ff9a5c;
      --red: #ff4d4d;
      --green: #4ade80;
      --gray: #6b7280;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #1f1a2e 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 70px; }

    /* Header */
    .header {
      padding: 16px 18px 10px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; background: rgba(14,14,20,.75); backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px); z-index: 10; border-bottom: 1px solid var(--border);
    }
    .header h1 { font-size: 20px; font-weight: 700; }
    .header .sub { font-size: 12px; color: var(--muted); }
    .header .premium-badge {
      background: linear-gradient(135deg, #ff8c42, #ff5e3a);
      color: #fff; font-size: 11px; font-weight: 700;
      padding: 5px 12px; border-radius: 20px; cursor: pointer;
      display: flex; align-items: center; gap: 4px;
      box-shadow: 0 4px 12px rgba(255,100,50,.35);
    }
    .header .premium-badge img { width: 14px; height: 14px; }

    /* Cards */
    .card {
      background: linear-gradient(180deg, var(--card) 0%, var(--bg2) 100%);
      border: 1px solid var(--border);
      border-radius: 20px; padding: 16px; margin: 10px 14px;
      box-shadow: 0 6px 20px rgba(0,0,0,.25);
    }
    .card-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
    .card-desc { font-size: 13px; color: var(--muted); }
    .grid { display: grid; grid-template-columns: 1fr; gap: 10px; padding: 0 14px; }
    .tile {
      background: linear-gradient(180deg, var(--card) 0%, var(--bg2) 100%);
      border: 1px solid var(--border); border-radius: 18px;
      padding: 12px 14px; cursor: pointer;
      transition: transform .12s, border-color .15s, box-shadow .15s;
      box-shadow: 0 4px 14px rgba(0,0,0,.2);
      display: flex; align-items: center; gap: 12px;
    }
    .tile:active { transform: scale(.96); }
    .tile:hover { border-color: var(--accent); box-shadow: 0 6px 18px rgba(255,100,50,.15); }
    .tile .emoji { font-size: 26px; margin-bottom: 8px; }
    .tile .name { font-size: 14px; font-weight: 600; }
    .tile .desc { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .tile.premium::after {
      content: "👑"; position: absolute; top: 8px; right: 10px; font-size: 14px;
    }
    .tile { position: relative; }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 10px 16px; border-radius: 12px; border: none; cursor: pointer;
      font-size: 14px; font-weight: 600; transition: transform .08s, opacity .15s;
    }
    .btn:active { transform: scale(.96); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent2); }
    .btn-ghost { background: var(--card2); color: var(--text); border: 1px solid var(--border); }
    .btn-danger { background: var(--red); color: #fff; }
    .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 8px; }
    .btn-block { width: 100%; }

    /* Inputs */
    input, textarea, select {
      width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg2); color: var(--text); font-size: 14px; outline: none;
      font-family: inherit;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 70px; }
    label { font-size: 12px; color: var(--muted); margin-bottom: 4px; display: block; }
    .field { margin-bottom: 12px; }

    /* Template card */
    .tpl-card {
      background: linear-gradient(180deg, var(--card) 0%, var(--bg2) 100%);
      border: 1px solid var(--border); border-radius: 18px;
      padding: 14px; margin-bottom: 10px; display: flex; gap: 12px; align-items: flex-start;
      box-shadow: 0 4px 14px rgba(0,0,0,.2);
    }
    .tpl-emoji { font-size: 24px; }
    .tpl-body { flex: 1; min-width: 0; }
    .tpl-name { font-weight: 600; font-size: 14px; }
    .tpl-text { font-size: 13px; color: var(--muted); margin-top: 2px; word-break: break-word; }
    .tpl-meta { font-size: 11px; color: var(--accent); margin-top: 4px; }
    .tpl-actions { display: flex; gap: 6px; flex-shrink: 0; }

    /* Chat list */
    .chat-item {
      display: flex; align-items: center; gap: 12px; padding: 12px 14px;
      border-radius: 18px; background: linear-gradient(180deg, var(--card) 0%, var(--bg2) 100%);
      margin-bottom: 8px; cursor: pointer; border: 1px solid var(--border);
      box-shadow: 0 4px 14px rgba(0,0,0,.2);
    }
    .chat-item.active-mute { border-color: var(--red); }
    .chat-avatar {
      width: 38px; height: 38px; border-radius: 50%; background: var(--accent);
      display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff;
    }
    .chat-name { font-weight: 600; font-size: 14px; }
    .chat-sub { font-size: 12px; color: var(--muted); }

    /* Bottom nav */
    .bottom-nav {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 480px;
      background: rgba(22,22,31,.85); border-top: 1px solid var(--border);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      display: flex; justify-content: space-around; padding: 8px 0 14px; z-index: 20;
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; color: var(--muted); font-size: 11px; padding: 4px 12px; }
    .nav-item.active { color: var(--accent); }
    .nav-item .ni { font-size: 20px; }
    .nav-item .ni img { width: 20px; height: 20px; }

    /* Modal */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 50;
      display: flex; align-items: flex-end; justify-content: center;
    }
    .modal {
      background: linear-gradient(180deg, var(--card) 0%, var(--bg2) 100%);
      border-radius: 24px 24px 0 0; width: 100%; max-width: 480px;
      padding: 20px; max-height: 85vh; overflow-y: auto;
      box-shadow: 0 -8px 30px rgba(0,0,0,.35);
    }
    .modal h2 { font-size: 18px; margin-bottom: 14px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 14px; }

    /* Misc */
    .section-header { padding: 14px 14px 6px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
    .row { display: flex; gap: 8px; align-items: center; }
    .spacer { height: 10px; }
    .empty { text-align: center; color: var(--muted); padding: 30px 14px; font-size: 13px; }
    .crown { color: #ffd700; }
    .toggle { display: flex; align-items: center; gap: 8px; }
    .switch {
      width: 40px; height: 22px; background: var(--card2); border-radius: 12px; position: relative; cursor: pointer;
      border: 1px solid var(--border);
    }
    .switch.on { background: var(--accent); }
    .switch::after {
      content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; background: #fff; border-radius: 50%; transition: left .2s;
    }
    .switch.on::after { left: 20px; }
    .color-dot { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
    .color-dot.selected { border-color: #fff; }
    .preview-box {
      background: var(--bg2); border: 1px dashed var(--border); border-radius: 10px;
      padding: 10px; font-size: 13px; margin-top: 8px; min-height: 40px; white-space: pre-wrap;
    }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .chip { display: inline-block; padding: 4px 10px; border-radius: 20px; background: var(--card2); font-size: 12px; margin: 2px; cursor: pointer; border: 1px solid var(--border); }
    .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .hidden { display: none !important; }
    .toast {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      background: var(--accent); color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 13px;
      z-index: 60; opacity: 0; transition: opacity .3s; pointer-events: none;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
<div class="app" id="app">
  <div class="header">
    <div>
      <h1>JUDI</h1>
      <div class="sub" id="userLine">Панель управления чатами</div>
    </div>
    <div class="premium-badge" id="premiumBadge" onclick="openPremium()"><iconify-icon icon="tabler:crown" width="14" height="14"></iconify-icon> Premium</div>
  </div>

  <div id="view"></div>
</div>

<div class="bottom-nav">
  <div class="nav-item active" data-nav="home" onclick="nav('home')"><div class="ni"><iconify-icon icon="tabler:home" width="20" height="20"></iconify-icon></div>Главная</div>
  <div class="nav-item" data-nav="chats" onclick="nav('chats')"><div class="ni"><iconify-icon icon="tabler:message" width="20" height="20"></iconify-icon></div>Чаты</div>
  <div class="nav-item" data-nav="settings" onclick="nav('settings')"><div class="ni"><iconify-icon icon="tabler:settings" width="20" height="20"></iconify-icon></div>Настройки</div>
  <div class="nav-item" data-nav="profile" onclick="nav('profile')"><div class="ni"><iconify-icon icon="tabler:user" width="20" height="20"></iconify-icon></div>Профиль</div>
</div>

<div class="toast" id="toast"></div>

<script>
// ---------- State ----------
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor("#0e0e14"); tg.setBackgroundColor("#0e0e14"); } catch(e){} }

const STORAGE_KEY = "judi_state_v1";
const defaultState = {
  premium: false,
  chats: [],
  spamTemplates: [
    { id: 1, emoji: "👋", name: "Приветствие", text: "Привет! Как дела?", repeat: 1 },
  ],
  buttonTemplates: [],
  afkTemplates: [
    { id: 1, emoji: "🌙", name: "Отошёл", text: "Сейчас не у дел, скоро вернусь.", online: true, offline: false, active: false, once: false, cooldown: 60, activation_id: "", buttons: [] },
  ],
  muteReply: "Пользователь в муте.",
  fontSettings: { all: true, mono: false, italic: false, bold: false, quote: false, underline: false, link: "", typing: false, chats: [] },
  selectedChat: null,
};
let state = loadState();
// Активация Premium по параметру URL / start_param (после оплаты Stars)
try {
  const params = new URLSearchParams(window.location.search);
  const startParam = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || "";
  // Этот параметр формирует сервер бота; сервер всё равно повторно проверяет Premium перед отправкой.
  if (params.get("premium") === "1") { state.premium = true; saveState(); }
  // Загрузка списка чатов от бота
  const settingsParam = params.get("settings");
  if (settingsParam) {
    try {
      let sb64 = settingsParam.replace(/-/g,"+").replace(/_/g,"/");
      while (sb64.length % 4) sb64 += "=";
      const serverSettings = JSON.parse(atob(sb64));
      if (Array.isArray(serverSettings.spamTemplates)) state.spamTemplates = serverSettings.spamTemplates;
      if (Array.isArray(serverSettings.afkTemplates)) state.afkTemplates = serverSettings.afkTemplates;
      if (Array.isArray(serverSettings.buttonTemplates)) state.buttonTemplates = serverSettings.buttonTemplates;
      if (typeof serverSettings.muteReply === "string") state.muteReply = serverSettings.muteReply;
      if (serverSettings.fontSettings && typeof serverSettings.fontSettings === "object") state.fontSettings = {...state.fontSettings,...serverSettings.fontSettings};
      saveState();
    } catch(e) { console.warn("JUDI settings payload invalid", e); }
  }
  const chatsParam = params.get("chats");
  if (chatsParam) {
    try {
      let b64 = chatsParam.replace(/-/g,"+").replace(/_/g,"/");
      while (b64.length % 4) b64 += "=";
      const decoded = JSON.parse(atob(b64));
      for (const [id, info] of Object.entries(decoded)) {
        const cid = +id;
        if (cid <= 0) continue; // только личные чаты
        const title = (typeof info === "string") ? info : (info.title || ("Чат " + cid));
        const avatar = (typeof info === "object" && info.avatar) ? info.avatar : null;
        const existing = state.chats.find(c=>c.id===cid);
        if (!existing) {
          state.chats.push({ id: cid, name: title, avatar: (title||"?").charAt(0).toUpperCase(), avatarUrl: avatar, muted: false, last: (typeof info === "object" ? info.last : 0), type: "private" });
        } else {
          existing.name = title;
          if (avatar) existing.avatarUrl = avatar;
          if (typeof info === "object" && info.last) existing.last = info.last;
          existing.type = "private";
        }
      }
      // Сортировка по активности (новые сверху)
      state.chats.sort((a,b) => (b.last||0) - (a.last||0));
      saveState();
    } catch(e){
      console.error("Ошибка загрузки чатов:", e);
    }
  }
  // Ссылка на бота (передаётся ботом через ?bot=username)
  const botParam = params.get("bot") || "";
  window._botLink = botParam ? ("https://t.me/" + botParam) : "";
  const bannerParam = params.get("banner") || "банера/main.mp4";
  window._bannerVideo = decodeURIComponent(bannerParam);
} catch(e){}

// Удаляем старые демо-чаты (из первых версий)
const legacyNames = { 1: "Общий чат", 2: "Игровой", 3: "Админка" };
state.chats = state.chats.filter(c => !(legacyNames[c.id] && c.name === legacyNames[c.id]));

function loadState(){ try { const s = JSON.parse(localStorage.getItem(STORAGE_KEY)); return s ? { ...defaultState, ...s } : { ...defaultState }; } catch(e){ return { ...defaultState }; } }
function saveState(){ try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){} }
function syncSettingsToBot(){
  if (!tg || !tg.sendData) return;
  try {
    const payload = JSON.stringify({action:"save_templates",spamTemplates:state.spamTemplates,afkTemplates:state.afkTemplates,buttonTemplates:state.buttonTemplates,muteReply:state.muteReply,fontSettings:state.fontSettings});
    if (new TextEncoder().encode(payload).length > 3900) { toast("Слишком много данных для одной синхронизации. Удали лишние шаблоны и повтори."); return; }
    tg.sendData(payload);
  } catch(e){ toast("Не удалось синхронизировать настройки"); }
}
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"), 2000); if(tg&&tg.HapticFeedback) try{tg.HapticFeedback.notificationOccurred("success");}catch(e){} }
function uid(){ return Date.now() + Math.floor(Math.random()*1000); }

// User line
const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
const inlineLaunch = !!(tg && tg.initDataUnsafe && tg.initDataUnsafe.query_id);
const connected = !!(tg && tg.sendData && !inlineLaunch);
function canSendData(){ return connected; }
document.getElementById("userLine").textContent = u
  ? ("@" + (u.username || u.first_name || u.id) + (connected ? " · бот подключён" : " · открой reply-кнопкой"))
  : "Тестовый режим (открой через бота)";
if (state.premium) document.getElementById("premiumBadge").innerHTML = '<iconify-icon icon="tabler:crown" width="14" height="14"></iconify-icon> Premium';

// ---------- Router ----------
let currentView = "home";
let currentSub = null; // for editors
function nav(view){ currentView = view; currentSub = null; render(); updateNav(); }
function updateNav(){ document.querySelectorAll(".nav-item").forEach(n=>n.classList.toggle("active", n.dataset.nav===currentView)); }
function render(){
  const v = document.getElementById("view");
  if (currentView === "home") v.innerHTML = renderHome();
  else if (currentView === "chats") v.innerHTML = renderChats();
  else if (currentView === "settings") v.innerHTML = renderSettings();
  else if (currentView === "profile") v.innerHTML = renderProfile();
  else if (currentView === "section") v.innerHTML = renderSection(currentSub);
  bindEvents();
}
function openSection(name){ currentView = "section"; currentSub = name; render(); }
function backHome(){ currentView = "home"; currentSub = null; render(); updateNav(); }

// ---------- Home ----------
function renderHome(){
  const tiles = [
    { key:"commands", emoji:"⚡", icon:null, name:"Функции и команды", desc:"Все команды JUDI" },
    { key:"chats", emoji:"💬", icon:"icons/chats.png", name:"Чаты", desc:"Список и поиск" },
    { key:"games", emoji:"🎮", icon:"icons/games.png", name:"Игры", desc:"Угадай слово" },
    { key:"streak", emoji:"🔥", icon:"icons/огонек.png", name:"Сирийчик", desc:"Ежедневная серия с контактом" },
    { key:"spam", emoji:"📢", icon:"icons/spam.png", name:"Спам", desc:"Шаблоны сообщений" },
    { key:"buttons", emoji:"🔘", icon:"icons/buttons.png", name:"Сообщения с кнопками", desc:"Конструктор", premium:true },
    { key:"afk", emoji:"🌙", icon:"icons/afk.png", name:"АФК", desc:"Статусы отсутствия" },
    { key:"font", emoji:"🔤", icon:"icons/font.png", name:"Шрифт", desc:"Форматирование" },
    { key:"mute", emoji:"🔇", icon:"icons/mute.png", name:"Мут", desc:"Управление чатами" },
  ];
  return `
    <div class="card" style="padding:0;overflow:hidden;margin-top:12px;position:relative;">
      <video id="judiBannerVideo"
             src="${esc(window._bannerVideo || 'банера/main.mp4')}"
             autoplay muted loop playsinline
             preload="metadata"
             style="display:block;width:100%;height:180px;object-fit:cover;background:#111;">
      </video>
      <div style="position:absolute;left:14px;bottom:12px;background:rgba(0,0,0,.58);backdrop-filter:blur(8px);padding:7px 10px;border-radius:12px;font-size:12px;font-weight:600;">
        JUDI • управление личкой
      </div>
    </div>
    <div class="section-header">Инструменты</div>
    <div class="grid">
      ${tiles.map(t=>`
        <div class="tile ${t.premium?'premium':''}" onclick="openSection('${t.key}')">
          <div class="emoji" style="flex-shrink:0;">${t.icon?`<img src="${t.icon}" style="width:40px;height:40px;object-fit:contain;" alt="">`:t.emoji}</div>
          <div style="flex:1;min-width:0;">
            <div class="name">${t.name}</div>
            <div class="desc">${t.desc}</div>
          </div>
        </div>
      `).join("")}
    </div>
    <div class="spacer"></div>
  `;
}

// ---------- Chats ----------
function renderChats(){
  const q = (window._chatQuery || "").toLowerCase();

  const filtered = state.chats.filter(c =>
    String(c.name || "").toLowerCase().includes(q)
  );

  return `
    <div class="section-header">Чаты</div>

    <div style="padding:0 14px 10px;display:flex;gap:8px;">

      <button
        class="btn btn-ghost"
        style="flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;"
        onclick="refreshChats()">

        <iconify-icon
          icon="tabler:refresh"
          width="16"
          height="16">
        </iconify-icon>

        Обновить
      </button>

    </div>

    <div class="card" style="margin:10px 14px;">

      <div class="card-title" style="font-size:13px;">
        <iconify-icon
          icon="tabler:briefcase"
          width="16"
          height="16">
        </iconify-icon>

        Telegram Business
      </div>

      <div
        class="card-desc"
        style="font-size:12px;line-height:1.6;">

        JUDI показывает только те личные чаты,
        к которым у бота есть доступ.

        <br><br>

        1. Telegram → Настройки →
        <b>Telegram Business</b> → Чат-боты.

        <br>

        2. Выбери JUDI.

        <br>

        3. Разреши нужные личные чаты.

        <br>

        4. Напиши сообщение в разрешённом чате.

        <br>

        5. Нажми «Обновить» здесь.

      </div>

    </div>

    <div style="padding:0 14px 10px;position:relative;">

      <iconify-icon
        icon="tabler:search"
        width="16"
        height="16"
        style="
          position:absolute;
          left:26px;
          top:50%;
          transform:translateY(-50%);
          opacity:.6;
        ">
      </iconify-icon>

      <input
        id="chatSearch"
        placeholder="Поиск по названию..."
        value="${esc(window._chatQuery || "")}"
        style="padding-left:36px;">

    </div>

    <div style="padding:0 14px;">

      ${
        filtered.length
        ?
        filtered.map(c => `

          <div
            class="chat-item ${c.muted ? "active-mute" : ""}"
            onclick="selectChat(${c.id})">

            <div class="chat-avatar">

              ${
                c.avatarUrl
                ?
                `<img
                  src="${esc(c.avatarUrl)}"
                  style="
                    width:100%;
                    height:100%;
                    border-radius:50%;
                    object-fit:cover;
                  "
                  alt="">`

                :

                esc(c.avatar || "?")
              }

function selectChat(id){ state.selectedChat = id; saveState(); toast("Чат выбран"); }

function sendQuickMessage(){
  const chatId = state.selectedChat;
  if (!chatId) { toast("Сначала выбери чат"); return; }
  if (!canSendData()) { toast("Открой JUDI reply-кнопкой 🎮 Открыть JUDI из бота"); return; }
  const chat = state.chats.find(c => c.id === chatId);
  openModal(`
    <h2>Отправить сообщение</h2>
    <div class="card-desc">Чат: ${esc(chat ? chat.name : chatId)}</div>
    <textarea id="quickTextInput" rows="4" placeholder="Введите текст сообщения" style="margin-top:10px;width:100%;"></textarea>
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="confirmQuickMessage()">Отправить</button>
      <button class="btn btn-ghost" onclick="closeModal()">Отмена</button>
    </div>
  `);
  setTimeout(() => { const el = document.getElementById("quickTextInput"); if (el) el.focus(); }, 50);
}

function confirmQuickMessage(){
  const chatId = state.selectedChat;
  if (!chatId) { toast("Сначала выбери чат"); return; }
  const text = (document.getElementById("quickTextInput")?.value || "").trim();
  if (!text) { toast("Введите текст"); return; }
  if (!canSendData()) { toast("Открой JUDI reply-кнопкой из бота"); return; }
  const chat = state.chats.find(c => c.id === chatId);
  const payload = {
    action: "send_message",
    chatId: chatId,
    chatName: chat ? chat.name : chatId,
    text: text
  };
  console.log("SEND DATA:", payload);
  try {
    tg.sendData(JSON.stringify(payload));
    closeModal();
    toast("Отправляю сообщение...");
  } catch(e) {
    console.error("sendData error:", e);
    toast("Ошибка отправки в бота. Смотри консоль.");
    return;
  }
  setTimeout(() => { try { tg.close(); } catch(e){} }, 600);
}
function refreshChats(){
  if (!canSendData()){
    toast("Открой JUDI reply-кнопкой 🎮 Открыть JUDI из бота");
    return;
  }
  console.log("SEND DATA:", { action: "refresh_chats" });
  tg.sendData(JSON.stringify({
    action: "refresh_chats"
  }));
  toast("Обновляю список чатов...");
  setTimeout(() => {
    try {
      tg.close();
    } catch(e) {}
  }, 500);
}
function deleteChat(id){
  if (confirm("Удалить чат из списка?")){ state.chats = state.chats.filter(c=>c.id!==id); saveState(); render(); toast("Удалено"); }
}

function startGame(){
  const sel = document.getElementById("gameChat");

  const chat = state.chats.find(c=>c.id===id);

function removeAfkButton(i){
  if (!window._afkBtnDraft) return;
  window._afkBtnDraft.splice(i,1);
  renderAfkButtons();
}
function collectAfkButtons(){
  const list = window._afkBtnDraft || [];
  const out = [];
  for (let i=0;i<list.length;i++){
    const text = (document.getElementById("ab_text_"+i)?.value || "").trim();
    if (!text) continue;
    out.push({
      text,
      action: (document.getElementById("ab_action_"+i)?.value || "tap").trim(),
      url: (document.getElementById("ab_url_"+i)?.value || "").trim(),
      alert: (document.getElementById("ab_alert_"+i)?.value || "").trim(),
      next: (document.getElementById("ab_next_"+i)?.value || "").trim()
    });
  }
  return out;
}

function saveAfk(id){
  const emoji = document.getElementById("ae_emoji").value.trim() || "🌙";
  const name = document.getElementById("ae_name").value.trim() || "Без названия";
  const text = document.getElementById("ae_text").value.trim();
  const online = document.getElementById("ae_online").classList.contains("on");
  const offline = document.getElementById("ae_offline").classList.contains("on");
  const once = document.getElementById("ae_once").classList.contains("on");
  const cooldown = Math.max(0, Number(document.getElementById("ae_cooldown").value || 0));
  const buttons = collectAfkButtons();
  if (!text){ toast("Введите текст"); return; }

  if (id){
    const t = state.afkTemplates.find(x=>x.id===id);
    Object.assign(t, {emoji,name,text,online,offline,once,cooldown,buttons});
  } else {
    state.afkTemplates.push({
      id: uid(), emoji, name, text, online, offline,
      active: false, once, cooldown, activation_id: "", buttons
    });
  }
  saveState(); closeModal(); render(); toast("Настройки АФК сохранены");
}
function deleteAfk(id){ if(confirm("Удалить?")){ state.afkTemplates = state.afkTemplates.filter(x=>x.id!==id); saveState(); render(); } }
function toggleAfk(id){
  const t = state.afkTemplates.find(x=>x.id===id);
  if (!t) return;
  const newActive = !t.active;

  state.afkTemplates.forEach(x=> x.active = false);
  if (newActive) {
    t.active = true;
    // Новый activation_id сбрасывает режим «только один раз» при повторном включении.
    t.activation_id = String(Date.now()) + "_" + Math.floor(Math.random()*1000);
  }

  saveState(); render(); toast(newActive ? "АФК включён" : "АФК выключен");

  if (tg && tg.sendData) {
    const activeTpl = state.afkTemplates.find(x=>x.active);
    tg.sendData(JSON.stringify({
      action: "afk_toggle",
      active: newActive,
      template: activeTpl ? {
        id: activeTpl.id,
        name: activeTpl.name,
        text: activeTpl.text,
        online: activeTpl.online,
        offline: activeTpl.offline,
        once: !!activeTpl.once,
        cooldown: Number(activeTpl.cooldown || 0),
        activation_id: activeTpl.activation_id,
        buttons: activeTpl.buttons || []
      } : null
    }));
  }
}
function turnOffAfk(){
  state.afkTemplates.forEach(x=> x.active = false);
  saveState(); render(); toast("АФК выключен");
  if (tg && tg.sendData) {
    tg.sendData(JSON.stringify({ action: "afk_toggle", active: false, template: null }));
  }
}

  if (tg && tg.sendData) tg.sendData(JSON.stringify({ action: "mute_settings", replyText: state.muteReply }));
}
function toggleMute(id){ const c = state.chats.find(x=>x.id===id); c.muted = !c.muted; saveState(); render(); toast(c.muted?"Мут включён":"Мут снят");
  if (tg && tg.sendData) {
    tg.sendData(JSON.stringify({ action: "mute_toggle", chatId: id, chatName: c.name, muted: c.muted, replyText: state.muteReply }));
  }
}

// ---------- Modal helpers ----------
function openModal(html){ document.getElementById("modalRoot")?.remove(); const d = document.createElement("div"); d.id="modalRoot"; d.className="modal-backdrop"; d.innerHTML=`<div class="modal">${html}</div>`; d.addEventListener("click",e=>{ if(e.target===d) closeModal(); }); document.body.appendChild(d); }
function closeModal(){ const d = document.getElementById("modalRoot"); if(d) d.remove(); }

// ---------- Events ----------
function bindEvents(){
  const s = document.getElementById("chatSearch");
  if (s){ s.addEventListener("input", e=>{ window._chatQuery = e.target.value; renderChatsView(); }); }
}

function confirmAddChat(){
    // Ничего не добавляем вручную.
    // Чаты приходят только от Telegram Business.
    toast("Чат добавляется автоматически после подключения через Telegram Business");

function renderChatsView(){
  // re-render only chats view without losing focus
  const v = document.getElementById("view");
  if (!v) return;
  v.innerHTML = renderChats();
  bindEvents();
  const s = document.getElementById("chatSearch");
  if (s){ s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
}

function esc(s){ return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

// initial
const requestedSection = new URLSearchParams(window.location.search).get("open");
