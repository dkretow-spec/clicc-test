<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Clicker Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      user-select: none;
      -webkit-user-select: none;
    }
    .card {
      background: rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      backdrop-filter: blur(10px);
    }
    h1 { font-size: 22px; margin-bottom: 8px; }
    .score {
      font-size: 48px;
      font-weight: 700;
      margin: 16px 0;
      color: #ffd700;
      text-shadow: 0 0 12px rgba(255,215,0,0.4);
    }
    .label { opacity: 0.7; font-size: 14px; margin-bottom: 24px; }
    .click-btn {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: none;
      background: radial-gradient(circle at 30% 30%, #ff6b6b, #c0392b);
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(192,57,43,0.5);
      transition: transform 0.08s ease;
      margin-bottom: 20px;
    }
    .click-btn:active { transform: scale(0.92); }
    .stats { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .stat {
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 8px 14px;
      font-size: 13px;
    }
    .stat b { color: #ffd700; }
    .reset {
      margin-top: 18px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
    }
    .reset:hover { background: rgba(255,255,255,0.1); }
    .float {
      position: fixed;
      pointer-events: none;
      font-weight: 700;
      color: #ffd700;
      animation: floatUp 0.8s ease-out forwards;
      font-size: 20px;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-60px); }
    }
    .user { margin-top: 12px; font-size: 12px; opacity: 0.6; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🖱️ Кликер</h1>
    <div class="score" id="score">0</div>
    <div class="label">монет за клик</div>
    <button class="click-btn" id="clickBtn">КЛИК!</button>
    <div class="stats">
      <div class="stat">Кликов: <b id="clicks">0</b></div>
      <div class="stat">За клик: <b id="perClick">1</b></div>
      <div class="stat">Рекорд: <b id="best">0</b></div>
    </div>
    <button class="reset" id="resetBtn">Сбросить</button>
    <div class="user" id="user"></div>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      try { tg.setHeaderColor("#1a1a2e"); } catch(e) {}
    }

    const scoreEl = document.getElementById("score");
    const clicksEl = document.getElementById("clicks");
    const perClickEl = document.getElementById("perClick");
    const bestEl = document.getElementById("best");
    const userEl = document.getElementById("user");

    let state = { score: 0, clicks: 0, perClick: 1, best: 0 };
    try {
      const saved = JSON.parse(localStorage.getItem("clicker_state") || "null");
      if (saved) state = { ...state, ...saved };
    } catch(e) {}

    function render() {
      scoreEl.textContent = state.score;
      clicksEl.textContent = state.clicks;
      perClickEl.textContent = state.perClick;
      bestEl.textContent = state.best;
    }

    function save() {
      try { localStorage.setItem("clicker_state", JSON.stringify(state)); } catch(e) {}
    }

    document.getElementById("clickBtn").addEventListener("click", (e) => {
      state.score += state.perClick;
      state.clicks += 1;
      if (state.score > state.best) state.best = state.score;
      render();
      save();
      spawnFloat(e.clientX, e.clientY, "+" + state.perClick);
      if (tg && tg.HapticFeedback) {
        try { tg.HapticFeedback.impactOccurred("light"); } catch(e) {}
      }
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      if (confirm("Сбросить прогресс?")) {
        state = { score: 0, clicks: 0, perClick: 1, best: state.best };
        render();
        save();
      }
    });

    function spawnFloat(x, y, text) {
      const el = document.createElement("div");
      el.className = "float";
      el.textContent = text;
      el.style.left = (x - 10) + "px";
      el.style.top = (y - 10) + "px";
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 800);
    }

    if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
      const u = tg.initDataUnsafe.user;
      userEl.textContent = "👤 " + (u.first_name || u.username || u.id);
    } else {
      userEl.textContent = "Тестовый режим (открой через бота)";
    }

    render();
  </script>
</body>
</html>
